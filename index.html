<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Performance Comercial - BI Vendas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #f4f6f9; }
    
    .header-titulo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 20px; border-bottom: 10px solid #0078d7; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #0078d7; margin: 0; }
    .titulo-aga { font-style: italic; color: #333; font-size: 1.2em; font-weight: bold; }

    .filtros, .bi-cards, .chart-container, .debug-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .linha { display: flex; gap: 20px; margin-top: 10px; }
    .linha label { flex: 1; font-weight: bold; font-size: 14px; color: #333; }
    input, select { padding: 9px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
    button { padding: 10px 15px; background: #0078d7; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #005a9e; }
    .btn-acao { margin-top: 15px; width: 100%; font-size: 15px; }
    
    .bi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .card h4 { margin: 0; color: #666; font-size: 0.9em; text-transform: uppercase; }
    .card p { margin: 10px 0 0; font-size: 1.6em; font-weight: bold; color: #333; }

    .chart-container { height: 400px; display: flex; justify-content: center; align-items: center; }

    /* Estilos Tabela de Depuração */
    .debug-container h3 { color: #0078d7; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: right; }
    th { background-color: #f8f9fa; color: #333; }
    tr:nth-child(even) { background-color: #fcfcfc; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 500px; max-height: 85vh; display: flex; flex-direction: column; }
    .modal-body { overflow-y: auto; max-height: 45vh; border: 1px solid #eee; padding: 10px; margin-bottom: 15px; }
    .erro { color: red; font-weight: bold; margin-top: 15px; text-align: center; }
    
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #0078d7; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header-titulo">
    <h2>Dashboard de Performance Comercial - BI Vendas</h2>
    <span class="titulo-aga">by AGA</span>
  </div>

  <div class="filtros">
    <div class="linha">
      <label>Lojas:
        <div class="input-grupo" style="margin-top: 5px; display: flex; gap: 10px;">
          <input type="text" id="lojas" placeholder="Ex: 1,2">
          <button type="button" onclick="abrirModalLojas()">Selecionar</button>
        </div>
      </label>
    </div>
    <div class="linha">
      <label>Data Inicial: <input type="date" id="dataInicial"></label>
      <label>Data Final: <input type="date" id="dataFinal"></label>
    </div>
    <button class="btn-acao" onclick="consultar()">Consultar Dashboard</button>
  </div>

  <div id="resultado"></div>

  <div class="bi-cards">
    <div class="card"><h4>Total Vendas (Bruto)</h4><p id="cardTotalBruto">R$ 0,00</p></div>
    <div class="card"><h4>Total Vendas (Líquido)</h4><p id="cardTotalLiquido">R$ 0,00</p></div>
    <div class="card"><h4>Ticket Médio</h4><p id="cardTicketMedio">R$ 0,00</p></div>
    <div class="card"><h4>Total de OS</h4><p id="cardTotalPedidos">0</p></div>
  </div>

  <div class="chart-container"><canvas id="graficoVendasLoja"></canvas></div>

  <!-- Área de Depuração -->
  <div class="debug-container">
    <h3>Depuração de Valores por OS</h3>
    <div id="tabelaDepuracao"></div>
  </div>

  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

  <!-- Modal -->
  <div id="modalLojas" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-body" id="listaLojasModal"></div>
      <button onclick="confirmarSelecaoLojas()">Confirmar</button>
    </div>
  </div>

  <script>
    const supabaseClient = supabase.createClient('https://cwmofpwuihrnifsvqhik.supabase.co', 'sb_publishable_biWjIRo9x6maeZXcoKX6Lw_l-fjV0wP');
    
    // ... (funções de suporte e modal permanecem as mesmas) ...
    function formatarMoedaBR(valor) { const n = Number(String(valor).replace(",", ".")); return isNaN(n) ? 0 : n; }
    function moedaParaTextoBR(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

    function processarEExibirBI(data) {
      if (!data || data.length === 0) return;

      const osMap = {};
      const debugData = [];

      data.forEach(item => {
        const numOS = item.OS || item.CODIGODAVENDA;
        if (!numOS) return;

        const vlrBruto = formatarMoedaBR(item.VALORBRUTOPRODUTO);
        const vlrLiquido = formatarMoedaBR(item.LIQUIDOPRODUTO);
        const tipoVenda = String(item.TIPOVENDA || "").trim().toUpperCase();
        const desc = formatarMoedaBR(item.DESCONTOVENDA);

        if (!osMap[numOS]) {
          osMap[numOS] = { tipo: tipoVenda, bruto: vlrBruto, liquido: formatarMoedaBR(item.VLRLIQUIDOVENDA) || vlrLiquido, desc: desc };
        } else {
          osMap[numOS].bruto += vlrBruto;
          osMap[numOS].liquido += vlrLiquido;
          if (desc > osMap[numOS].desc) osMap[numOS].desc = desc;
        }
      });

      let totalB = 0, totalL = 0, count = 0;
      const vendasPorOS = {};

      Object.keys(osMap).forEach(numOS => {
        const o = osMap[numOS];
        let finalBruto = o.bruto;
        if (o.tipo === "TROCA") finalBruto -= o.desc;

        debugData.push({ numOS, tipo: o.tipo, brutoInicial: o.bruto, desc: o.desc, brutoFinal: finalBruto });
        
        totalB += finalBruto;
        totalL += o.liquido;
        count++;
        vendasPorOS[numOS] = o.liquido;
      });

      // Atualiza UI
      document.getElementById("cardTotalBruto").textContent = moedaParaTextoBR(totalB);
      document.getElementById("cardTotalLiquido").textContent = moedaParaTextoBR(totalL);
      document.getElementById("cardTicketMedio").textContent = moedaParaTextoBR(totalL / count);
      document.getElementById("cardTotalPedidos").textContent = count;

      // Renderiza Tabela de Depuração
      let html = `<table><tr><th>OS</th><th>Tipo</th><th>Bruto Inicial</th><th>Desconto</th><th>Bruto Final</th></tr>`;
      debugData.forEach(d => {
        html += `<tr><td>${d.numOS}</td><td>${d.tipo}</td><td>${moedaParaTextoBR(d.brutoInicial)}</td><td>${moedaParaTextoBR(d.desc)}</td><td><strong>${moedaParaTextoBR(d.brutoFinal)}</strong></td></tr>`;
      });
      document.getElementById("tabelaDepuracao").innerHTML = html + `</table>`;
    }

    // ... (restante das funções auxiliares: abrirModalLojas, consultar, etc) ...
  </script>
</body>
</html>
