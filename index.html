<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Performance Comercial - BI Vendas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #f4f6f9; }
    
    .header-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 10px solid #0078d7;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    h2 { color: #0078d7; margin: 0; }
    .titulo-aga { font-style: italic; color: #333; font-size: 1.2em; font-weight: bold; }

    .filtros { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .linha { display: flex; gap: 20px; margin-top: 10px; }
    .linha label { flex: 1; font-weight: bold; font-size: 14px; color: #333; }
    input, select { padding: 9px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
    button { padding: 10px 15px; background: #0078d7; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #005a9e; }
    .btn-acao { margin-top: 15px; width: 100%; font-size: 15px; }
    
    .input-grupo { display: flex; gap: 10px; align-items: center; }
    .btn-modal { background: #6c757d; white-space: nowrap; }
    .btn-modal:hover { background: #5a6268; }

    .bi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; border-left: 5px solid #0078d7; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h4 { margin: 0; color: #666; font-size: 0.9em; text-transform: uppercase; }
    .card p { margin: 10px 0 0; font-size: 1.6em; font-weight: bold; color: #333; }

    .chart-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; height: 400px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 500px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .modal-header { font-weight: bold; font-size: 16px; margin-bottom: 12px; color: #0078d7; }
    .modal-body { overflow-y: auto; max-height: 45vh; border: 1px solid #eee; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    .modal-body label { display: flex; justify-content: space-between; padding: 6px 4px; cursor: pointer; font-weight: normal; border-bottom: 1px solid #f9f9f9; font-size: 13px; }
    .modal-body label:hover { background: #f1f1f1; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; }
    
    .erro { color: red; font-weight: bold; margin-top: 15px; text-align: center; }
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; gap: 15px; }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #0078d7; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header-titulo">
    <h2>Dashboard de Performance Comercial - BI Vendas</h2>
    <span class="titulo-aga">by AGA</span>
  </div>

  <div class="filtros">
    <div class="linha">
      <label>Lojas:
        <div class="input-grupo">
          <input type="text" id="lojas" placeholder="Ex: 1,2">
          <button type="button" class="btn-modal" onclick="abrirModalLojas()">Selecionar</button>
        </div>
      </label>
    </div>
    <div class="linha">
      <label>Data Inicial: <input type="date" id="dataInicial"></label>
      <label>Data Final: <input type="date" id="dataFinal"></label>
    </div>
    <button class="btn-acao" onclick="consultar()">Consultar Dashboard</button>
  </div>

  <div id="resultado"></div>

  <div class="bi-cards">
    <div class="card"><h4>Total Vendas (Bruto)</h4><p id="cardTotalBruto">R$ 0,00</p></div>
    <div class="card"><h4>Total Vendas (Líquido)</h4><p id="cardTotalLiquido">R$ 0,00</p></div>
    <div class="card"><h4>Ticket Médio</h4><p id="cardTicketMedio">R$ 0,00</p></div>
    <div class="card"><h4>Total de OS</h4><p id="cardTotalPedidos">0</p></div>
  </div>

  <div class="chart-container">
    <canvas id="graficoVendasLoja"></canvas>
  </div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Processando indicadores...</div>
  </div>

  <div id="modalLojas" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">Selecionar Lojas</div>
      <input type="text" id="inputFiltroGerenteModal" placeholder="Filtrar..." onkeyup="filtrarLojasNoModal()">
      <div class="modal-body" id="listaLojasModal"></div>
      <div class="modal-footer">
        <button type="button" onclick="fecharModalLojas()">Cancelar</button>
        <button type="button" onclick="confirmarSelecaoLojas()">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cwmofpwuihrnifsvqhik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_biWjIRo9x6maeZXcoKX6Lw_l-fjV0wP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let lojasDisponiveis = [];
    let meuGrafico = null;

    // Funções utilitárias mantidas
    const formatarMoedaBR = (v) => parseFloat(String(v).replace(',', '.') || 0);
    const moedaParaTextoBR = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    function processarEExibirBI(data) {
      if (!data || data.length === 0) return;

      const osMap = {};

      data.forEach(item => {
        const numOS = item.OS || item.CODIGODAVENDA;
        if (!numOS) return;

        const vlrBrutoProdutoItem = formatarMoedaBR(item.VALORBRUTOPRODUTO);
        const vlrLiquidoProdutoItem = formatarMoedaBR(item.LIQUIDOPRODUTO);
        const vlrLiquidoVendaHeader = formatarMoedaBR(item.VLRLIQUIDOVENDA);

        if (!osMap[numOS]) {
          osMap[numOS] = {
            vlrLiquidoVenda: vlrLiquidoVendaHeader,
            vlrBrutoTotalVenda: vlrBrutoProdutoItem,
            vlrLiquidoTotalItens: vlrLiquidoProdutoItem
          };
        } else {
          osMap[numOS].vlrBrutoTotalVenda += vlrBrutoProdutoItem;
          osMap[numOS].vlrLiquidoTotalItens += vlrLiquidoProdutoItem;
        }
      });

      let totalLiquidoGeral = 0;
      let totalBrutoGeral = 0;
      let totalOSCount = 0;
      const vendasPorOS = {};

      Object.keys(osMap).forEach(numOS => {
        const vendaOS = osMap[numOS];
        let liquidoEfetivoOS = vendaOS.vlrLiquidoVenda !== 0 ? vendaOS.vlrLiquidoVenda : vendaOS.vlrLiquidoTotalItens;
        
        totalLiquidoGeral += liquidoEfetivoOS;
        totalBrutoGeral += vendaOS.vlrBrutoTotalVenda;
        totalOSCount++;
        vendasPorOS[numOS] = liquidoEfetivoOS;
      });

      atualizarKPIs(totalBrutoGeral, totalLiquidoGeral, totalOSCount > 0 ? totalLiquidoGeral / totalOSCount : 0, totalOSCount);
      atualizarGraficoPorOS(vendasPorOS);
    }

    function atualizarKPIs(bruto, liquido, ticket, quantidade) {
      document.getElementById("cardTotalBruto").textContent = moedaParaTextoBR(bruto);
      document.getElementById("cardTotalLiquido").textContent = moedaParaTextoBR(liquido);
      document.getElementById("cardTicketMedio").textContent = moedaParaTextoBR(ticket);
      document.getElementById("cardTotalPedidos").textContent = quantidade.toLocaleString('pt-BR');
    }

    function atualizarGraficoPorOS(vendasPorOS) {
      const ctx = document.getElementById('graficoVendasLoja').getContext('2d');
      if (meuGrafico) meuGrafico.destroy();
      meuGrafico = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(vendasPorOS).map(os => 'OS ' + os),
          datasets: [{ data: Object.values(vendasPorOS), backgroundColor: '#0078d7' }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    async function consultar() {
      document.getElementById("loadingOverlay").style.display = "flex";
      // ... (Lógica de fetch mantida igual)
      try {
        const response = await fetch("/consulta", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            DATAINICIAL: document.getElementById("dataInicial").value,
            DATAFINAL: document.getElementById("dataFinal").value,
            LOJAS: document.getElementById("lojas").value
          })
        });
        const dados = await response.json();
        processarEExibirBI(dados);
      } catch (e) { alert("Erro ao consultar"); }
      finally { document.getElementById("loadingOverlay").style.display = "none"; }
    }
  </script>
</body>
</html>
