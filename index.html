<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Performance Comercial - BI Vendas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #f4f6f9; }
    .header-titulo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 20px; border-bottom: 10px solid #0078d7; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #0078d7; margin: 0; }
    .titulo-aga { font-style: italic; color: #333; font-size: 1.2em; font-weight: bold; }
    .filtros { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .linha { display: flex; gap: 20px; margin-top: 10px; }
    .linha label { flex: 1; font-weight: bold; font-size: 14px; color: #333; }
    input, select { padding: 9px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
    button { padding: 10px 15px; background: #0078d7; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #005a9e; }
    .btn-acao { margin-top: 15px; width: 100%; font-size: 15px; }
    .bi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; border-left: 5px solid #0078d7; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h4 { margin: 0; color: #666; font-size: 0.9em; text-transform: uppercase; }
    .card p { margin: 10px 0 0; font-size: 1.6em; font-weight: bold; color: #333; }
    .chart-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; height: 400px; }
    
    /* Estilos Tabela de Depuração */
    .debug-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: right; }
    th { background-color: #f8f9fa; color: #333; }
    
    /* Modais e Loadings */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 500px; max-height: 85vh; display: flex; flex-direction: column; }
    .modal-body { overflow-y: auto; max-height: 45vh; border: 1px solid #eee; padding: 10px; margin-bottom: 15px; }
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
  </style>
</head>
<body>

  <div class="header-titulo">
    <h2>Dashboard de Performance Comercial - BI Vendas</h2>
    <span class="titulo-aga">by AGA</span>
  </div>

  <div class="filtros">
    <div class="linha">
      <label>Lojas:
        <div style="display: flex; gap: 10px; margin-top: 5px;">
          <input type="text" id="lojas" placeholder="Ex: 1,2">
          <button type="button" onclick="abrirModalLojas()">Selecionar</button>
        </div>
      </label>
    </div>
    <div class="linha">
      <label>Data Inicial: <input type="date" id="dataInicial"></label>
      <label>Data Final: <input type="date" id="dataFinal"></label>
    </div>
    <button class="btn-acao" onclick="consultar()">Consultar Dashboard</button>
  </div>

  <div class="bi-cards">
    <div class="card"><h4>Total Vendas (Bruto)</h4><p id="cardTotalBruto">R$ 0,00</p></div>
    <div class="card"><h4>Total Vendas (Líquido)</h4><p id="cardTotalLiquido">R$ 0,00</p></div>
    <div class="card"><h4>Ticket Médio</h4><p id="cardTicketMedio">R$ 0,00</p></div>
    <div class="card"><h4>Total de OS</h4><p id="cardTotalPedidos">0</p></div>
  </div>

  <div class="chart-container"><canvas id="graficoVendasLoja"></canvas></div>

  <div class="debug-container">
    <h3>Depuração: Detalhamento por OS</h3>
    <div id="tabelaDepuracao"></div>
  </div>

  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

  <div id="modalLojas" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-body" id="listaLojasModal"></div>
      <button onclick="confirmarSelecaoLojas()">Confirmar Seleção</button>
    </div>
  </div>

  <script>
    const supabaseClient = supabase.createClient('https://cwmofpwuihrnifsvqhik.supabase.co', 'sb_publishable_biWjIRo9x6maeZXcoKX6Lw_l-fjV0wP');
    let lojasDisponiveis = [];

    // Carregamento Inicial
    window.onload = async () => {
      const { data } = await supabaseClient.from('lojas').select('id, nome, gerente').order('id');
      lojasDisponiveis = data || [];
    };

    function abrirModalLojas() {
      const container = document.getElementById("listaLojasModal");
      container.innerHTML = "";
      lojasDisponiveis.forEach(loja => {
        container.innerHTML += `<label><input type="checkbox" value="${loja.id}"> [${loja.id}] ${loja.nome}</label><br>`;
      });
      document.getElementById("modalLojas").style.display = "flex";
    }

    function confirmarSelecaoLojas() {
      const checked = document.querySelectorAll("#listaLojasModal input:checked");
      document.getElementById("lojas").value = Array.from(checked).map(c => c.value).join(",");
      document.getElementById("modalLojas").style.display = "none";
    }

    // Lógica de Processamento e Debug
    async function consultar() {
      // ... sua lógica de fetch /consulta aqui ...
      // Simulação para o exemplo (substitua pela sua chamada real):
      alert("Consulta iniciada...");
    }

    function processarEExibirBI(data) {
      let debugHtml = `<table><tr><th>OS</th><th>Tipo</th><th>Bruto</th><th>Líquido</th></tr>`;
      
      data.forEach(item => {
        debugHtml += `<tr><td>${item.OS}</td><td>${item.TIPOVENDA}</td><td>${item.VALORBRUTOPRODUTO}</td><td>${item.LIQUIDOPRODUTO}</td></tr>`;
      });
      
      document.getElementById("tabelaDepuracao").innerHTML = debugHtml + `</table>`;
      // ... restante da lógica de atualizar gráficos e KPIs ...
    }
  </script>
</body>
</html>
