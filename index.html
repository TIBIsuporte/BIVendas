<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Performance Comercial - BI Vendas</title>
  <!-- Importando Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Importando Chart.js para os gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #f4f6f9; }
    
    .header-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 10px solid #0078d7;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    h2 { color: #0078d7; margin: 0; }
    .titulo-aga { font-style: italic; color: #333; font-size: 1.2em; font-weight: bold; }

    /* Seção de Filtros no Topo */
    .filtros { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .linha { display: flex; gap: 20px; margin-top: 10px; }
    .linha label { flex: 1; font-weight: bold; font-size: 14px; color: #333; }
    input, select { padding: 9px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
    button { padding: 10px 15px; background: #0078d7; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #005a9e; }
    .btn-acao { margin-top: 15px; width: 100%; font-size: 15px; }
    
    .input-grupo { display: flex; gap: 10px; align-items: center; }
    .btn-modal { background: #6c757d; white-space: nowrap; }
    .btn-modal:hover { background: #5a6268; }

    /* Cards de BI / Indicadores (Atualizado para 5 colunas) */
    .bi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; border-left: 5px solid #0078d7; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h4 { margin: 0; color: #666; font-size: 0.85em; text-transform: uppercase; }
    .card p { margin: 10px 0 0; font-size: 1.4em; font-weight: bold; color: #333; }

    /* Área do Gráfico */
    .chart-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; height: 450px; display: flex; justify-content: center; align-items: center; position: relative; }

    /* Modal Lojas */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 500px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .modal-header { font-weight: bold; font-size: 16px; margin-bottom: 12px; color: #0078d7; display: flex; justify-content: space-between; align-items: center; }
    
    .modal-busca-container { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    .modal-busca-container label { font-size: 12px; font-weight: bold; color: #555; }

    .modal-body { overflow-y: auto; max-height: 45vh; border: 1px solid #eee; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    .modal-body label { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; cursor: pointer; font-weight: normal; border-bottom: 1px solid #f9f9f9; font-size: 13px; }
    .modal-body label:hover { background: #f1f1f1; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-secundario { background: #6c757d; }
    .btn-secundario:hover { background: #5a6268; }

    .erro { color: red; font-weight: bold; margin-top: 15px; text-align: center; }
    
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; gap: 15px; }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #0078d7; border-radius: 50%; animation: spin 1s linear infinite; }
    .loading-text { font-weight: bold; color: #0078d7; font-size: 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header-titulo">
    <h2>Dashboard de Performance Comercial - BI Vendas</h2>
    <span class="titulo-aga">by AGA</span>
  </div>

  <div class="filtros">
    <div class="linha">
      <label>Lojas (IDs separados por vírgula):
        <div class="input-grupo" style="margin-top: 5px;">
          <input type="text" id="lojas" placeholder="Ex: 1,2 ou selecione no botão">
          <button type="button" class="btn-modal" onclick="abrirModalLojas()">Selecionar Lojas</button>
        </div>
      </label>
    </div>
    <div class="linha">
      <label>Data Inicial:
        <input type="date" id="dataInicial">
      </label>
      <label>Data Final:
        <input type="date" id="dataFinal">
      </label>
    </div>
    <button class="btn-acao" onclick="consultar()">Consultar Dashboard</button>
  </div>

  <div id="resultado"></div>

  <div class="bi-cards">
    <div class="card">
      <h4>Total Vendas (Bruto)</h4>
      <p id="cardTotalBruto">R$ 0,00</p>
    </div>
    <div class="card">
      <h4>Total Vendas (Líquido)</h4>
      <p id="cardTotalLiquido">R$ 0,00</p>
    </div>
    <div class="card">
      <h4>Total Descontos</h4>
      <p id="cardTotalDesconto">R$ 0,00</p>
    </div>
    <div class="card">
      <h4>Ticket Médio</h4>
      <p id="cardTicketMedio">R$ 0,00</p>
    </div>
    <div class="card">
      <h4>Total de Ordens (OS)</h4>
      <p id="cardTotalPedidos">0</p>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="graficoVendasLoja"></canvas>
  </div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Processando indicadores de BI, por favor aguarde...</div>
  </div>

  <!-- Modal Lojas -->
  <div id="modalLojas" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span>Selecionar Lojas</span>
      </div>
      <div class="modal-busca-container">
        <label>Filtrar por Código, Nome da Loja ou Gerente:</label>
        <input type="text" id="inputFiltroGerenteModal" placeholder="Digite para filtrar..." onkeyup="filtrarLojasNoModal()">
      </div>
      <div style="margin-bottom: 8px;">
        <label style="font-size: 13px; cursor: pointer; font-weight: bold; display: flex; justify-content: flex-start; gap: 8px;">
          <input type="checkbox" id="selecionarTodasLojas" onclick="toggleSelecionarTodasLojas(this)" style="width: auto;"> Selecionar / Desmarcar Lojas Visíveis
        </label>
      </div>
      <div class="modal-body" id="listaLojasModal"></div>
      <div class="modal-footer">
        <button type="button" class="btn-secundario" onclick="fecharModalLojas()">Cancelar</button>
        <button type="button" onclick="confirmarSelecaoLojas()">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cwmofpwuihrnifsvqhik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_biWjIRo9x6maeZXcoKX6Lw_l-fjV0wP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let lojasDisponiveis = [];
    let meuGrafico = null;

    window.onload = async () => {
      try {
        const { data, error } = await supabaseClient
          .from('lojas')
          .select('id, nome, gerente')
          .order('id', { ascending: true });
        
        if (error) throw error;
        lojasDisponiveis = data || [];
      } catch (err) {
        console.error("Erro ao carregar lojas do Supabase:", err.message);
      }
    };

    function abrirModalLojas() {
      document.getElementById("inputFiltroGerenteModal").value = "";
      renderizarListaLojasModal(lojasDisponiveis);
      document.getElementById("modalLojas").style.display = "flex";
    }

    function renderizarListaLojasModal(lista) {
      const container = document.getElementById("listaLojasModal");
      container.innerHTML = "";
      const idsAtuais = document.getElementById("lojas").value.split(",").map(s => s.trim());
      const listaOrdenada = [...lista].sort((a, b) => Number(a.id) - Number(b.id));

      listaOrdenada.forEach(loja => {
        const checked = idsAtuais.includes(String(loja.id)) ? "checked" : "";
        container.innerHTML += `
          <label class="item-loja-modal" data-texto="[${loja.id}] ${loja.nome} ${loja.gerente || ''}">
            <div>
              <input type="checkbox" value="${loja.id}" ${checked} style="width: auto; margin-right: 8px;"> 
              <strong>[${loja.id}]</strong> ${loja.nome}
            </div>
            <span style="color: #666; font-size: 11px;">Gerente: ${loja.gerente || '-'}</span>
          </label>
        `;
      });
    }

    function filtrarLojasNoModal() {
      const termo = document.getElementById("inputFiltroGerenteModal").value.trim().toUpperCase();
      const labels = document.querySelectorAll("#listaLojasModal .item-loja-modal");
      labels.forEach(label => {
        const texto = label.getAttribute("data-texto").toUpperCase();
        label.style.display = (texto.includes(termo) || termo === "") ? "flex" : "none";
      });
    }

    function fecharModalLojas() { document.getElementById("modalLojas").style.display = "none"; }

    function toggleSelecionarTodasLojas(master) {
      document.querySelectorAll("#listaLojasModal .item-loja-modal").forEach(label => {
        if (label.style.display !== "none") {
          const cb = label.querySelector("input[type='checkbox']");
          if (cb) cb.checked = master.checked;
        }
      });
    }

    function confirmarSelecaoLojas() {
      const ids = [];
      document.querySelectorAll("#listaLojasModal input[type='checkbox']").forEach(cb => { if (cb.checked) ids.push(cb.value); });
      document.getElementById("lojas").value = ids.join(",");
      fecharModalLojas();
    }

    function formatarDataISOparaBR(dataISO) {
      if (!dataISO) return "";
      const p = dataISO.split("-");
      return `${p[2]}/${p[1]}/${p[0]}`;
    }

    function formatarMoedaBR(valor) {
      const n = Number(String(valor || 0).replace(",", "."));
      return isNaN(n) ? 0 : n;
    }

    function moedaParaTextoBR(valor) {
      return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    async function consultar() {
      document.getElementById("loadingOverlay").style.display = "flex";
      document.getElementById("resultado").innerHTML = "";

      const body = {
        DATAINICIAL: formatarDataISOparaBR(document.getElementById("dataInicial").value),
        DATAFINAL: formatarDataISOparaBR(document.getElementById("dataFinal").value),
        LOJAS: document.getElementById("lojas").value
      };

      try {
        const response = await fetch("/consulta", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!response.ok) throw new Error("Erro na requisição: " + response.status);
        processarEExibirBI(await response.json());
      } catch (error) {
        document.getElementById("resultado").innerHTML = "<p class='erro'>" + error.message + "</p>";
        atualizarKPIs(0, 0, 0, 0, 0);
        atualizarGraficoPizza({});
      } finally {
        document.getElementById("loadingOverlay").style.display = "none";
      }
    }

    function processarEExibirBI(data) {
      if (!data || data.length === 0) {
        document.getElementById("resultado").innerHTML = "<p class='erro'>Nenhum resultado encontrado.</p>";
        atualizarKPIs(0, 0, 0, 0, 0);
        atualizarGraficoPizza({});
        return;
      }

      const osMap = {};
      data.forEach(item => {
        const numOS = item.OS || item.CODIGODAVENDA;
        const idLoja = item.LOJA || "sem-loja";
        const chaveUnica = `${idLoja}_${numOS}`;
        
        if (!numOS) return;

        // Captura e normaliza os valores dos campos
        const vlrLiquidoVenda = formatarMoedaBR(item.VLRLIQUIDOVENDA);
        const descontoVenda = formatarMoedaBR(item.DESCONTOVENDA);
        const vlrBrutoProduto = formatarMoedaBR(item.VALORBRUTOPRODUTO);
        const liquidoProduto = formatarMoedaBR(item.LIQUIDOPRODUTO);
        const descontoProduto = Math.abs(formatarMoedaBR(item.DESCONTOVALORPRODUTO)); // Totaliza valor de desconto absoluto/positivo

        if (!osMap[chaveUnica]) {
          osMap[chaveUnica] = {
            loja: idLoja,
            numOS: numOS,
            tipoVenda: String(item.TIPOVENDA || "").trim().toUpperCase(),
            vlrLiquidoVenda: vlrLiquidoVenda,
            descontoVenda: descontoVenda,
            vlrBrutoTotalVenda: vlrBrutoProduto,
            vlrLiquidoTotalItens: liquidoProduto,
            totalDescontosItens: descontoProduto
          };
        } else {
          osMap[chaveUnica].vlrBrutoTotalVenda += vlrBrutoProduto;
          osMap[chaveUnica].vlrLiquidoTotalItens += liquidoProduto;
          osMap[chaveUnica].totalDescontosItens += descontoProduto;
          if (descontoVenda > osMap[chaveUnica].descontoVenda) {
            osMap[chaveUnica].descontoVenda = descontoVenda;
          }
        }
      });

      let tLiq = 0, tBru = 0, tDesc = 0, tOS = 0;
      const vendasPorLoja = {};

      Object.keys(osMap).forEach(chave => {
        const v = osMap[chave];
        let liq = v.vlrLiquidoVenda > 0 ? v.vlrLiquidoVenda : v.vlrLiquidoTotalItens;
        let bru = v.vlrBrutoTotalVenda;
        let desc = v.totalDescontosItens > 0 ? v.totalDescontosItens : v.descontoVenda;

        // Regras para TROCA e DEVOLUCAO
        if (v.tipoVenda === "TROCA") {
          bru -= v.descontoVenda;
        } else if (v.tipoVenda === "DEVOLUCAO") {
          // Devoluções reduzem o faturamento líquido e bruto
          // Como os dados costumam vir negativos, garantimos a coerência do abatimento
          if (liq > 0) liq = -Math.abs(liq);
          if (bru > 0) bru = -Math.abs(bru);
        }

        tLiq += liq;
        tBru += bru;
        tDesc += Math.abs(desc);
        if (bru !== 0 || liq !== 0) tOS++;

        // Buscar nome da loja se disponível na lista carregada
        let nomeLojaStr = `Loja ${v.loja}`;
        const lojaEncontrada = lojasDisponiveis.find(l => String(l.id) === String(v.loja));
        if (lojaEncontrada) {
          nomeLojaStr = `[${lojaEncontrada.id}] ${lojaEnnotFound = lojaEncontrada.nome}`;
        }

        if (!vendasPorLoja[nomeLojaStr]) {
          vendasPorLoja[nomeLojaStr] = 0;
        }
        vendasPorLoja[nomeLojaStr] += liq;
      });

      atualizarKPIs(tBru, tLiq, tDesc, tOS > 0 ? tLiq / tOS : 0, tOS);
      atualizarGraficoPizza(vendasPorLoja);
    }

    function atualizarKPIs(bruto, liquido, desconto, ticket, qtd) {
      document.getElementById("cardTotalBruto").textContent = moedaParaTextoBR(bruto);
      document.getElementById("cardTotalLiquido").textContent = moedaParaTextoBR(liquido);
      document.getElementById("cardTotalDesconto").textContent = moedaParaTextoBR(desconto);
      document.getElementById("cardTicketMedio").textContent = moedaParaTextoBR(ticket);
      document.getElementById("cardTotalPedidos").textContent = qtd.toLocaleString('pt-BR');
    }

    function atualizarGraficoPizza(vendasPorLoja) {
      const ctx = document.getElementById('graficoVendasLoja').getContext('2d');
      if (meuGrafico) meuGrafico.destroy();

      const labels = Object.keys(vendasPorLoja);
      const dataValues = Object.values(vendasPorLoja);
      
      const totalGeral = dataValues.reduce((acc, val) => acc + val, 0);

      meuGrafico = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: [
              '#0078d7', '#28a745', '#ffc107', '#dc3545', '#6f42c1', 
              '#20c997', '#fd7e14', '#e83e8c', '#17a2b8', '#6c757d'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const valor = context.raw || 0;
                  const percentual = totalGeral > 0 ? ((valor / totalGeral) * 100).toFixed(2) : 0;
                  return ` Valor Líquido: ${moedaParaTextoBR(valor)} (${percentual}%)`;
                }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
