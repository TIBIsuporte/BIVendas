<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Performance Comercial - BI Vendas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #f4f6f9; }
    
    .header-titulo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 20px; border-bottom: 10px solid #0078d7; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #0078d7; margin: 0; }
    .titulo-aga { font-style: italic; color: #333; font-size: 1.2em; font-weight: bold; }

    .filtros { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .linha { display: flex; gap: 20px; margin-top: 10px; }
    .linha label { flex: 1; font-weight: bold; font-size: 14px; color: #333; }
    input, select { padding: 9px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
    button { padding: 10px 15px; background: #0078d7; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #005a9e; }
    .btn-acao { margin-top: 15px; width: 100%; font-size: 15px; }
    .input-grupo { display: flex; gap: 10px; align-items: center; }
    .btn-modal { background: #6c757d; white-space: nowrap; }

    .bi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; border-left: 5px solid #0078d7; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h4 { margin: 0; color: #666; font-size: 0.9em; text-transform: uppercase; }
    .card p { margin: 10px 0 0; font-size: 1.6em; font-weight: bold; color: #333; }

    .chart-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; height: 400px; }

    /* Estilo do Grid - ADICIONADO */
    .grid-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; overflow-x: auto; }
    .grid-container table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    .grid-container th { background: #0078d7; color: #fff; padding: 10px; text-align: center; }
    .grid-container td { padding: 8px; border-bottom: 1px solid #eee; text-align: center; }
    .grid-container tr:hover { background: #f9f9f9; }

    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; gap: 15px; }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #0078d7; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header-titulo">
    <h2>Dashboard de Performance Comercial - BI Vendas</h2>
    <span class="titulo-aga">by AGA</span>
  </div>

  <div class="filtros">
    <div class="linha">
      <label>Lojas (IDs separados por vírgula):
        <div class="input-grupo" style="margin-top: 5px;">
          <input type="text" id="lojas" placeholder="Ex: 540,541">
          <button type="button" class="btn-modal" onclick="abrirModalLojas()">Selecionar Lojas</button>
        </div>
      </label>
    </div>
    <div class="linha">
      <label>Data Inicial: <input type="date" id="dataInicial"></label>
      <label>Data Final: <input type="date" id="dataFinal"></label>
    </div>
    <button class="btn-acao" onclick="consultar()">Consultar Dashboard</button>
  </div>

  <div class="bi-cards">
    <div class="card"><h4>Total Vendas (Líquido)</h4><p id="cardTotalLiquido">R$ 0,00</p></div>
    <div class="card"><h4>Ticket Médio</h4><p id="cardTicketMedio">R$ 0,00</p></div>
    <div class="card"><h4>Total de Pedidos</h4><p id="cardTotalPedidos">0</p></div>
  </div>

  <div class="chart-container">
    <canvas id="graficoVendasLoja"></canvas>
  </div>

  <!-- GRID DE DETALHAMENTO ADICIONADO AO FINAL -->
  <div class="grid-container">
    <h3>Detalhamento das Vendas</h3>
    <table>
      <thead>
        <tr>
          <th>Loja</th><th>Cód. Venda</th><th>Tipo</th><th>V. Bruto</th><th>Desc %</th><th>Desc R$</th><th>Desc Caixa</th><th>V. Líquido</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </div>

  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

  <script>
    // [SUA LÓGICA ANTERIOR MANTIDA]
    // ... (modal, variáveis, etc)

    function processarEExibirBI(data) {
      if (!data || data.length === 0) return;

      let totalLiquido = 0, totalPedidos = 0, vendasPorLoja = {};
      let htmlRows = "";

      data.forEach(venda => {
        const vLiq = formatarMoedaBR(venda.VALORLIQUIDO);
        totalLiquido += vLiq;
        totalPedidos++;
        vendasPorLoja[venda.NOMELOJA] = (vendasPorLoja[venda.NOMELOJA] || 0) + vLiq;

        // POPULANDO GRID
        htmlRows += `<tr>
          <td>${venda.CODIGOLOJA}</td>
          <td>${venda.CODIGOVENDA}</td>
          <td>${venda.TIPODEVENDA}</td>
          <td>${moedaParaTextoBR(venda.VALORBRUTO)}</td>
          <td>${Number(venda.DESCONTOPERCENTUAL).toFixed(2)}%</td>
          <td>${moedaParaTextoBR(venda.DESCONTOVALOR)}</td>
          <td>${moedaParaTextoBR(venda.DESCONTOCAIXA)}</td>
          <td style="font-weight:bold; color:#0078d7;">${moedaParaTextoBR(venda.VALORLIQUIDO)}</td>
        </tr>`;
      });

      document.getElementById("corpoTabela").innerHTML = htmlRows;
      atualizarKPIs(totalLiquido, totalLiquido/totalPedidos, totalPedidos);
      atualizarGraficoPorLojas(vendasPorLoja);
    }

    // ... (restante das suas funções originais de suporte e Supabase)
  </script>
</body>
</html>
