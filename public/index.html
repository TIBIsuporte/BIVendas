<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Auditoria: BI</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="header-titulo">
    <h2>Auditoria: BI</h2>
    <span class="titulo-aga">by AGA</span>
  </div>

  <div class="filtros">
    <div class="linha">
      <label>Lojas (IDs separados por vírgula):
        <div class="input-grupo" style="margin-top: 5px;">
          <input type="text" id="lojas" placeholder="Ex: 540,541 ou selecione no botão">
          <button type="button" class="btn-modal" onclick="abrirModalLojas()">Selecionar Lojas</button>
        </div>
      </label>
    </div>
    <div class="linha">
      <label>Data Inicial:
        <input type="date" id="dataInicial">
      </label>
      <label>Data Final:
        <input type="date" id="dataFinal">
      </label>
    </div>
    <div class="linha">
      <label>Tipo de Data:
        <select id="tipodata">
          <option value="VENDA" selected>VENDA</option>
          <option value="PAGAMENTO">PAGAMENTO</option>
          <option value="ENTREGA">ENTREGA</option>
        </select>
      </label>
    </div>
    <button class="btn-acao" onclick="consultar()">Consultar Relatório Completo</button>
  </div>

  <div id="resultado"></div>

<!-- CONTAINER DE CARDS BI OTIMIZADO PARA 5 COLUNAS -->
<div class="bi-cards-container" id="biCardsContainer" style="display: none; grid-template-columns: repeat(5, 1fr); gap: 10px;">
  
  <div class="bi-card" style="border-left-color: #0275d8; padding: 10px;">
    <div class="bi-card-title" style="font-size: 11px;">VALOR BRUTO TOTAL</div>
    <div class="bi-card-value" id="cardValorBruto">R$ 0,00</div>
  </div>

  <div class="bi-card" style="border-left-color: #d9534f; padding: 10px;">
    <div class="bi-card-title" style="font-size: 11px;">VALOR DESCONTO TOTAL</div>
    <div class="bi-card-value" id="cardDesconto">R$ 0,00</div>
  </div>

  <div class="bi-card" style="border-left-color: #5cb85c; padding: 10px;">
    <div class="bi-card-title" style="font-size: 11px;">VALOR LÍQUIDO TOTAL</div>
    <div class="bi-card-value" id="cardValorLiquido">R$ 0,00</div>
  </div> 

  <div class="bi-card" style="border-left-color: #f0ad4e; padding: 10px;">
    <div class="bi-card-title" style="font-size: 11px;">QTDE VENDAS</div>
    <div class="bi-card-value" id="cardQtdeVendas">0</div>
  </div>
  
  <div class="bi-card" style="border-left-color: #6f42c1; padding: 10px;">
    <div class="bi-card-title" style="font-size: 11px;">TICKET MÉDIO</div>
    <div class="bi-card-value" id="cardTicketMedio">R$ 0,00</div>
  </div>

  <!-- Resumo de Formas de Pagamento e Parcelas embaixo -->
  <div class="bi-card" style="border-left-color: #17a2b8; grid-column: 1 / -1; padding: 15px;">
    <div class="bi-card-title">Resumo de Pagamento & Parcelas</div>
    <div class="bi-card-value" id="cardResumoPagamento" style="font-size: 14px; font-weight: normal; line-height: 1.5; text-align: left;">
      Aguardando consulta...
    </div>
  </div>

</div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Buscando relatório na API, por favor aguarde...</div>
  </div>

  <div id="modalLojas" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span>Selecionar Lojas</span>
      </div>
      <div class="modal-busca-container">
        <label>Filtrar por Código, Nome da Loja ou Gerente:</label>
        <input type="text" id="inputFiltroGerenteModal" placeholder="Digite para filtrar..." onkeyup="filtrarLojasNoModal()">
      </div>
      <div style="margin-bottom: 8px;">
        <label style="font-size: 13px; cursor: pointer; font-weight: bold; display: flex; justify-content: flex-start; gap: 8px;">
          <input type="checkbox" id="selecionarTodasLojas" onclick="toggleSelecionarTodasLojas(this)" style="width: auto;"> Selecionar / Desmarcar Lojas Visíveis
        </label>
      </div>
      <div class="modal-body" id="listaLojasModal"></div>
      <div class="modal-footer">
        <button type="button" class="btn-secundario" onclick="fecharModalLojas()">Cancelar</button>
        <button type="button" onclick="confirmarSelecaoLojas()">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="/js/lojas-modal.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
