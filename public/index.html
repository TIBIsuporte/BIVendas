<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Auditoria: Relatório de OS Pendentes</title>
  
  <!-- Importando Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Importando CSS Externo -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="header-titulo">
    <h2>Auditoria: Relatório de OS Pendentes</h2>
    <span class="titulo-aga">by AGA</span>
  </div>

  <div class="filtros">
    <div class="linha">
      <label>Lojas (IDs separados por vírgula):
        <div class="input-grupo" style="margin-top: 5px;">
          <input type="text" id="lojas" placeholder="Ex: 540,541 ou selecione no botão">
          <button type="button" class="btn-modal" onclick="abrirModalLojas()">Selecionar Lojas</button>
        </div>
      </label>
    </div>
    <div class="linha">
      <label>Data Inicial:
        <input type="date" id="dataInicial">
      </label>
      <label>Data Final:
        <input type="date" id="dataFinal">
      </label>
    </div>
    <div class="linha">
      <label>Tipo de Data:
        <select id="tipodata">
          <option value="VENDA" selected>VENDA</option>
          <option value="PAGAMENTO">PAGAMENTO</option>
          <option value="ENTREGA">ENTREGA</option>
        </select>
      </label>
    </div>
    <button class="btn-acao" onclick="consultar()">Consultar Relatório Completo</button>
  </div>

  <div id="resultado"></div>

  <!-- Grid Principal -->
  <div class="grid-container">
    <h3>
      <span>Resultado da Consulta</span>
      <span id="totalRegistros" style="font-size: 13px; color: #555;">0 registros encontrados</span>
    </h3>
    <div class="table-wrapper">
      <table id="tabelaDados">
        <thead id="cabecalhoTabela">
          <tr><th>Aguardando Consulta</th></tr>
        </thead>
        <tbody id="corpoTabela">
          <tr><td style="text-align: center; color: #777;">Preencha os filtros e clique em Consultar.</td></tr>
        </tbody>
        <tfoot id="rodapeTabela"></tfoot>
      </table>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Buscando relatório na API, por favor aguarde...</div>
  </div>

  <!-- Modal Lojas -->
  <div id="modalLojas" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span>Selecionar Lojas</span>
      </div>
      <div class="modal-busca-container">
        <label>Filtrar por Código, Nome da Loja ou Gerente:</label>
        <input type="text" id="inputFiltroGerenteModal" placeholder="Digite para filtrar..." onkeyup="filtrarLojasNoModal()">
      </div>
      <div style="margin-bottom: 8px;">
        <label style="font-size: 13px; cursor: pointer; font-weight: bold; display: flex; justify-content: flex-start; gap: 8px;">
          <input type="checkbox" id="selecionarTodasLojas" onclick="toggleSelecionarTodasLojas(this)" style="width: auto;"> Selecionar / Desmarcar Lojas Visíveis
        </label>
      </div>
      <div class="modal-body" id="listaLojasModal"></div>
      <div class="modal-footer">
        <button type="button" class="btn-secundario" onclick="fecharModalLojas()">Cancelar</button>
        <button type="button" onclick="confirmarSelecaoLojas()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Importando o JS do Modal de Lojas -->
  <script src="/js/lojas-modal.js"></script>

  <!-- Script Principal da Página -->
  <script>
    const SUPABASE_URL = 'https://cwmofpwuihrnifsvqhik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_biWjIRo9x6maeZXcoKX6Lw_l-fjV0wP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Lista exclusiva de colunas de valores que serão totalizadas
    const COLUNAS_VALORES_TOTALIZAR = [
      'VALORBRUTO',
      'DESCONTOPERCENTUAL',
      'DESCONTOVALOR',
      'DESCONTOCAIXA',
      'VALORLIQUIDO',
      'VALORJARECEBIDO',
      'VALORDEDEVOLUCAO',
      'VALORDECREDITOGERADO',
      'VALORDECREDITOUSADO'
    ];

    window.onload = async () => {
      // Chama a função que está no arquivo lojas-modal.js
      await carregarLojasSupabase(supabaseClient);
    };

    function formatarDataISOparaBR(dataISO) {
      if (!dataISO) return "";
      const partes = dataISO.split("-");
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function parseNumeroBR(valor) {
      if (valor === null || valor === undefined || valor === "") return 0;
      if (typeof valor === 'number') return valor;
      const n = parseFloat(String(valor).replace(/\./g, '').replace(',', '.'));
      return isNaN(n) ? 0 : n;
    }

    function formatarMoedaBR(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    async function consultar() {
      document.getElementById("loadingOverlay").style.display = "flex";
      document.getElementById("resultado").innerHTML = "";

      const body = {
        DATAINICIAL: formatarDataISOparaBR(document.getElementById("dataInicial").value),
        DATAFINAL: formatarDataISOparaBR(document.getElementById("dataFinal").value),
        LOJAS: document.getElementById("lojas").value,
        TIPODATA: document.getElementById("tipodata").value || "VENDA",
        TIPOVENDA: ""
      };

      try {
        const response = await fetch("/consulta", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (!response.ok) throw new Error("Erro na requisição: " + response.status);

        const dadosBrutos = await response.json();
        renderizarGridTodosCampos(dadosBrutos);
      } catch (error) {
        document.getElementById("resultado").innerHTML = "<p class='erro'>" + error.message + "</p>";
        limparTabela();
      } finally {
        document.getElementById("loadingOverlay").style.display = "none";
      }
    }

    function renderizarGridTodosCampos(dados) {
      const thead = document.getElementById("cabecalhoTabela");
      const tbody = document.getElementById("corpoTabela");
      const tfoot = document.getElementById("rodapeTabela");
      const labelTotal = document.getElementById("totalRegistros");

      thead.innerHTML = "";
      tbody.innerHTML = "";
      tfoot.innerHTML = "";

      if (!dados || dados.length === 0) {
        labelTotal.textContent = "0 registros encontrados";
        thead.innerHTML = "<tr><th>Mensagem</th></tr>";
        tbody.innerHTML = "<tr><td style='text-align: center;'>Nenhum registro encontrado.</td></tr>";
        return;
      }

      const lojasDigitadas = document.getElementById("lojas").value.trim();
      let dadosFiltrados = dados;

      if (lojasDigitadas) {
        const idsFiltro = lojasDigitadas.split(",").map(id => id.trim());
        dadosFiltrados = dados.filter(item => {
          const codLoja = String(item.CODIGOLOJA ?? item.LOJA ?? item.loja ?? item.IdLoja ?? "").trim();
          return idsFiltro.includes(codLoja);
        });
      }

      if (dadosFiltrados.length === 0) {
        labelTotal.textContent = "0 registros encontrados";
        thead.innerHTML = "<tr><th>Mensagem</th></tr>";
        tbody.innerHTML = "<tr><td style='text-align: center;'>Nenhum registro encontrado para a(s) loja(s) informada(s).</td></tr>";
        return;
      }

      labelTotal.textContent = `${dadosFiltrados.length.toLocaleString('pt-BR')} registros encontrados`;

      const colunas = Object.keys(dadosFiltrados[0]);

      // Monta Cabeçalho
      let trHead = document.createElement("tr");
      colunas.forEach(coluna => {
        let th = document.createElement("th");
        th.textContent = coluna;
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);

      // Objeto acumulador de totais
      const totais = {};
      COLUNAS_VALORES_TOTALIZAR.forEach(col => totais[col] = 0);

      // Preenche Células e calcula soma das colunas mapeadas
      dadosFiltrados.forEach(item => {
        let tr = document.createElement("tr");
        colunas.forEach(coluna => {
          let td = document.createElement("td");
          let valor = item[coluna];

          td.textContent = (valor === null || valor === undefined) ? "-" : valor;
          tr.appendChild(td);

          if (COLUNAS_VALORES_TOTALIZAR.includes(coluna.toUpperCase())) {
            totais[coluna.toUpperCase()] += parseNumeroBR(valor);
          }
        });
        tbody.appendChild(tr);
      });

      // Monta o Rodapé (TFOOT)
      let trFoot = document.createElement("tr");
      colunas.forEach((coluna, index) => {
        let td = document.createElement("td");
        const colunaUpper = coluna.toUpperCase();

        if (index === 0) {
          td.textContent = "TOTAL";
        } else if (COLUNAS_VALORES_TOTALIZAR.includes(colunaUpper)) {
          if (colunaUpper === 'DESCONTOPERCENTUAL') {
            td.textContent = totais[colunaUpper].toFixed(2) + " %";
          } else {
            td.textContent = formatarMoedaBR(totais[colunaUpper]);
          }
          td.classList.add("text-right");
        } else {
          td.textContent = "-";
        }
        trFoot.appendChild(td);
      });
      tfoot.appendChild(trFoot);
    }

    function limparTabela() {
      document.getElementById("totalRegistros").textContent = "0 registros encontrados";
      document.getElementById("cabecalhoTabela").innerHTML = "<tr><th>Status</th></tr>";
      document.getElementById("corpoTabela").innerHTML = "<tr><td style='text-align: center; color: red;'>Erro ao carregar dados.</td></tr>";
      document.getElementById("rodapeTabela").innerHTML = "";
    }
  </script>
</body>
</html>
